name: Pylint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and Pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pylint

      - name: Analyze tracked Python files
        run: >-
          pylint --output-format=colorized
          --rcfile=.github/workflows/.pylintrc
          $(git ls-files '*.py' ':!:setup.py')
